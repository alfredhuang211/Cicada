<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="default">
        <meta name="theme-color" content="#f2f2f7">
        
        <title>Cicada</title>
        
        <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
        <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
        <link rel="manifest" href="/site.webmanifest">

        <meta property="og:title" content="Cicada: Minimalist Whiteboard">
        <meta property="og:description" content="A minimalist, high-performance digital whiteboard for the web. Supports infinite canvas and image export.">
        <meta property="og:image" content="/assets/og-card.png">
        <meta name="twitter:card" content="summary_large_image">
        
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Lora:ital@0;1&display=swap" rel="stylesheet">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
        
        <link rel="stylesheet" href="./src/styles.css">
    </head>
    <body>
        <canvas id="base"></canvas>
        <canvas id="live"></canvas>
        <canvas id="cur"></canvas>
        <textarea id="ti" rows="1" spellcheck="false"></textarea>
        
        <nav id="bar">
            <button class="tb" id="btn-hand" title="Hand / Pan (H)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 11V8a2 2 0 0 0-4 0v3"/>
                    <path d="M14 8V6a2 2 0 0 0-4 0v5"/>
                    <path d="M10 8V5a2 2 0 0 0-4 0v9l-1-1a2 2 0 0 0-2.73.73L2 15l4 4h8a4 4 0 0 0 4-4V8"/>
                </svg>
            </button>
            <button class="tb on" id="btn-pen" title="Pen (P)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
                </svg>
            </button>
            <button class="tb" id="btn-text" title="Text (T)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="4 7 4 4 20 4 20 7"/>
                    <line x1="9" y1="20" x2="15" y2="20"/>
                    <line x1="12" y1="4" x2="12" y2="20"/>
                </svg>
            </button>
            <button class="tb" id="btn-shapes" title="Shapes">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/>
                    <rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/>
                </svg>
            </button>
            <button class="tb" id="btn-line" title="Line (L)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="19" x2="19" y2="5"/><polyline points="13,5 19,5 19,11"/>
                </svg>
            </button>
            <button class="tb" id="btn-sticky" title="Sticky Note">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9z"/>
                    <polyline points="15 3 15 9 21 9"/>
                </svg>
            </button>
            <button class="tb" id="btn-eraser" title="Eraser (E)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="14" height="9" rx="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    <line x1="3" y1="20" x2="21" y2="20"/>
                </svg>
            </button>
            <div class="sep"></div>
            
            <button class="tb" id="btn-undo" title="Undo ⌘Z">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 14 4 9 9 4"/>
                    <path d="M20 20v-7a4 4 0 0 0-4-4H4"/>
                </svg>
            </button>
            <button class="tb" id="btn-redo" title="Redo ⌘⇧Z">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 14 20 9 15 4"/>
                    <path d="M4 20v-7a4 4 0 0 1 4-4h12"/>
                </svg>
            </button>
            <div class="sep"></div>
            
            <button id="btn-color" title="Color">
                <span id="color-dot"></span>
            </button>
            <div class="sep"></div>
            
            <button class="wb on" data-wi="0" title="Thin"><span class="dot" style="width:3px;height:3px"></span></button>
            <button class="wb" data-wi="1" title="Medium"><span class="dot" style="width:8px;height:8px"></span></button>
            <button class="wb" data-wi="2" title="Thick"><span class="dot" style="width:14px;height:14px"></span></button>
            <div class="sep"></div>
            
            <button class="tb" id="btn-save" title="Save current view as link"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></button>
        </nav>
        <div id="shape-picker" class="sp-hidden">
            <button class="sp-item" data-tool="rect">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="1"/></svg>
                <span>Rectangle</span>
            </button>
            <button class="sp-item" data-tool="diamond">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polygon points="12,3 21,12 12,21 3,12"/></svg>
                <span>Diamond</span>
            </button>
            <button class="sp-item" data-tool="ellipse">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="12" rx="10" ry="6"/></svg>
                <span>Ellipse</span>
            </button>
        </div>
        <div id="line-picker" class="sp-hidden">
            <div class="sp-line-row">
                <button class="sp-item" data-tool="line" data-arrows="0">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="12" x2="20" y2="12"/></svg>
                    <span>No arrows</span>
                </button>
            </div>
            <div class="sp-line-row">
                <button class="sp-item" data-tool="line" data-arrows="1">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="12" x2="18" y2="12"/><polyline points="13,7 18,12 13,17"/></svg>
                    <span>End arrow</span>
                </button>
            </div>
            <div class="sp-line-row">
                <button class="sp-item" data-tool="line" data-arrows="2">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="12" x2="20" y2="12"/><polyline points="15,7 20,12 15,17"/><polyline points="9,7 4,12 9,17"/></svg>
                    <span>Both arrows</span>
                </button>
            </div>
        </div>
        <button id="zoom-hud" title="Reset view (0)">100%</button>
        <div id="io-hud">
            <button id="btn-export" title="Export as JSON">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            </button>
            <button id="btn-import" title="Import from JSON">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            </button>
            <button id="btn-clear" title="Clear canvas">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
            </button>
        </div>
        <div id="color-picker" class="sp-hidden"></div>
        <input type="file" id="file-input" accept=".json" style="display:none">
        <div id="toast"></div>
        
        <script type="module" src="./src/main.js"></script>
    </body>
</html>
